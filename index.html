<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Work Hours Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --bg-panel: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .glass-panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: var(--glass-shadow);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .clock-panel {
      text-align: center;
      margin: 2rem 0;
    }

    .live-clock {
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
      font-variant-numeric: tabular-nums;
    }

    .current-date {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.1rem;
      font-weight: 500;
      background: rgba(255,255,255,0.05);
      padding: 0.5rem 1.2rem;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .status-dot.active { background: var(--success); box-shadow: 0 0 12px var(--success); animation: pulse-green 2s infinite; }
    .status-dot.paused { background: var(--warning); box-shadow: 0 0 12px var(--warning); animation: pulse-orange 2s infinite; }
    .status-dot.ended { background: var(--danger); box-shadow: 0 0 12px var(--danger); }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    @keyframes pulse-orange {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      width: 100%;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 200px;
      padding: 1.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
      filter: grayscale(0.5);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .punch-in {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.7);
    }
    .punch-in:hover:not(:disabled) { box-shadow: 0 15px 25px -10px rgba(16, 185, 129, 0.9); transform: translateY(-2px); }

    .break {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 10px 20px -10px rgba(245, 158, 11, 0.7);
    }
    .break:hover:not(:disabled) { box-shadow: 0 15px 25px -10px rgba(245, 158, 11, 0.9); transform: translateY(-2px); }

    .punch-out {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 20px -10px rgba(239, 68, 68, 0.7);
    }
    .punch-out:hover:not(:disabled) { box-shadow: 0 15px 25px -10px rgba(239, 68, 68, 0.9); transform: translateY(-2px); }

    .today-stats {
      display: flex;
      gap: 1rem;
      width: 100%;
    }
    .stat-box {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      padding: 1.5rem;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .stat-label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .history-panel {
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
    }

    .month-selector {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }
    .month-selector h2 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 1.2rem;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.05); }

    .table-container {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      min-width: 600px;
    }
    th, td { 
      padding: 1rem 1.2rem; 
      text-align: left; 
      border-bottom: 1px solid var(--border); 
    }
    th { 
      font-weight: 600; 
      color: var(--text-muted); 
      font-size: 0.85rem; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.02);
    }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.2s; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.05); }

    .btn-primary {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: inherit;
    }
    .btn-primary:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
    }

    @media (max-width: 650px) {
      body { padding: 0; background: var(--bg); }
      .app-container { gap: 0; }
      .glass-panel { 
        border-radius: 0; 
        border-left: none; 
        border-right: none;
        border-top: none;
        box-shadow: none; 
      }
      .action-buttons { flex-direction: column; }
      .btn { max-width: 100%; }
      .today-stats { flex-direction: column; }
      .live-clock { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="glass-panel">
      <header>
        <h1>Time Tracker</h1>
        <button id="exportBtn" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export
        </button>
      </header>

      <div class="clock-panel">
        <div id="liveClock" class="live-clock">00:00:00</div>
        <div id="currentDate" class="current-date">Loading date...</div>
      </div>

      <div class="control-panel">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span id="statusText">Ready to start</span>
        </div>
        
        <div class="action-buttons">
          <button id="punchInBtn" class="btn punch-in">Punch In</button>
          <button id="breakBtn" class="btn break" disabled>Break</button>
          <button id="punchOutBtn" class="btn punch-out" disabled>Punch Out</button>
        </div>

        <div class="today-stats" id="todayStats" style="display:none;">
          <div class="stat-box">
            <span class="stat-label">Total Break Time</span>
            <span class="stat-value" id="todayBreak">0h 0m</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Total Work Hours</span>
            <span class="stat-value" id="todayWork">0h 0m</span>
          </div>
        </div>
      </div>
    </div>

    <div class="glass-panel history-panel">
      <div class="month-selector">
        <button id="prevMonth" class="icon-btn" aria-label="Previous Month">&lt;</button>
        <h2 id="monthLabel">Month Year</h2>
        <button id="nextMonth" class="icon-btn" aria-label="Next Month">&gt;</button>
      </div>

      <div class="table-container">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Punch In</th>
              <th>Punch Out</th>
              <th>Break Time</th>
              <th>Work Hours</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'workHoursData';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    let currentViewMonth = new Date();

    function getTodayString() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    let today = getTodayString();
    let todayData = appData[today] || { inTime: null, outTime: null, breaks: [] };

    function saveToday() {
      appData[today] = todayData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      updateUI();
    }

    function formatTime(ms) {
      if (!ms) return '-';
      return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDuration(ms) {
      if (!ms || ms < 0) return '0h 0m';
      const totalMins = Math.floor(ms / 60000);
      const h = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      return `${h}h ${m}m`;
    }

    function calculateBreakTotalMs(breaks) {
      if (!breaks) return 0;
      return breaks.reduce((total, b) => {
        if (b.end) return total + (b.end - b.start);
        return total + (Date.now() - b.start);
      }, 0);
    }

    function calculateWorkMs(data) {
      if (!data.inTime) return 0;
      const end = data.outTime || Date.now();
      const totalDuration = end - data.inTime;
      const breakMs = calculateBreakTotalMs(data.breaks);
      return Math.max(0, totalDuration - breakMs);
    }

    function updateUI() {
      const isPunchedIn = !!todayData.inTime;
      const isPunchedOut = !!todayData.outTime;
      const isOnBreak = todayData.breaks && todayData.breaks.some(b => !b.end);

      const punchInBtn = document.getElementById('punchInBtn');
      const breakBtn = document.getElementById('breakBtn');
      const punchOutBtn = document.getElementById('punchOutBtn');
      const statusDot = document.querySelector('.status-dot');
      const statusText = document.getElementById('statusText');
      const todayStats = document.getElementById('todayStats');

      statusDot.className = 'status-dot';

      if (!isPunchedIn) {
        statusText.textContent = "Ready to start";
        punchInBtn.disabled = false;
        breakBtn.disabled = true;
        punchOutBtn.disabled = true;
        breakBtn.textContent = "Break";
        todayStats.style.display = 'none';
      } else if (isPunchedOut) {
        statusText.textContent = "Shift ended";
        statusDot.classList.add('ended');
        punchInBtn.disabled = true;
        breakBtn.disabled = true;
        punchOutBtn.disabled = true;
        breakBtn.textContent = "Break";
        todayStats.style.display = 'flex';
      } else if (isOnBreak) {
        statusText.textContent = "On Break";
        statusDot.classList.add('paused');
        punchInBtn.disabled = true;
        breakBtn.disabled = false;
        breakBtn.textContent = "Break Over";
        punchOutBtn.disabled = false;
        todayStats.style.display = 'flex';
      } else {
        statusText.textContent = "Currently Working";
        statusDot.classList.add('active');
        punchInBtn.disabled = true;
        breakBtn.disabled = false;
        breakBtn.textContent = "Break";
        punchOutBtn.disabled = false;
        todayStats.style.display = 'flex';
      }

      if (isPunchedIn) {
        document.getElementById('todayWork').textContent = formatDuration(calculateWorkMs(todayData));
        document.getElementById('todayBreak').textContent = formatDuration(calculateBreakTotalMs(todayData.breaks));
      }

      renderHistoryTable();
    }

    function renderHistoryTable() {
      document.getElementById('monthLabel').textContent = currentViewMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      
      const y = currentViewMonth.getFullYear();
      const m = currentViewMonth.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';

      let hasData = false;

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const data = appData[dateStr];
        
        if (data && data.inTime) {
          hasData = true;
          const tr = document.createElement('tr');
          const isToday = dateStr === today;
          const workMs = isToday && !data.outTime ? calculateWorkMs(data) : (data.outTime ? calculateWorkMs(data) : 0);
          const breakMs = calculateBreakTotalMs(data.breaks);
          
          tr.innerHTML = `
            <td>${new Date(y, m, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td>
            <td>${formatTime(data.inTime)}</td>
            <td>${formatTime(data.outTime) || (isToday ? '<span style="color:var(--success)">Working...</span>' : '-')}</td>
            <td>${formatDuration(breakMs)}</td>
            <td>${formatDuration(workMs)}</td>
          `;
          tbody.appendChild(tr);
        }
      }

      if (!hasData) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No entries for this month</td></tr>`;
      }
    }

    // Actions
    document.getElementById('punchInBtn').onclick = () => {
      if (!todayData.inTime) {
        todayData.inTime = Date.now();
        todayData.breaks = [];
        saveToday();
      }
    };

    document.getElementById('breakBtn').onclick = () => {
      if (!todayData.breaks) todayData.breaks = [];
      const currentBreak = todayData.breaks.find(b => !b.end);
      if (currentBreak) {
        currentBreak.end = Date.now(); // End break
      } else {
        todayData.breaks.push({ start: Date.now(), end: null }); // Start break
      }
      saveToday();
    };

    document.getElementById('punchOutBtn').onclick = () => {
      if (todayData.inTime && !todayData.outTime) {
        const currentBreak = todayData.breaks && todayData.breaks.find(b => !b.end);
        if (currentBreak) currentBreak.end = Date.now();
        todayData.outTime = Date.now();
        saveToday();
      }
    };

    // Month Navigation
    document.getElementById('prevMonth').onclick = () => {
      currentViewMonth.setMonth(currentViewMonth.getMonth() - 1);
      updateUI();
    };
    document.getElementById('nextMonth').onclick = () => {
      currentViewMonth.setMonth(currentViewMonth.getMonth() + 1);
      updateUI();
    };

    // Export to Excel
    document.getElementById('exportBtn').onclick = () => {
      const y = currentViewMonth.getFullYear();
      const m = currentViewMonth.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      
      const exportData = [["Date", "Punch In", "Punch Out", "Break Time", "Work Hours", "Decimal Work Hours"]];

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const data = appData[dateStr];
        
        if (data && data.inTime) {
          const dateLabel = new Date(y, m, d).toLocaleDateString('en-US');
          const inStr = formatTime(data.inTime);
          const outStr = formatTime(data.outTime) || (dateStr === today && !data.outTime ? 'Working...' : '-');
          const breakMs = calculateBreakTotalMs(data.breaks);
          const workMs = (dateStr === today && !data.outTime) ? calculateWorkMs(data) : (data.outTime ? calculateWorkMs(data) : 0);
          
          exportData.push([
            dateLabel, 
            inStr, 
            outStr, 
            formatDuration(breakMs), 
            formatDuration(workMs), 
            (workMs / 3600000).toFixed(2)
          ]);
        }
      }

      if (exportData.length === 1) {
        alert("No data to export for " + document.getElementById('monthLabel').textContent);
        return;
      }

      const ws = XLSX.utils.aoa_to_sheet(exportData);
      
      // Auto-size columns
      ws['!cols'] = [
        { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 18 }
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Work Hours");
      XLSX.writeFile(wb, `WorkHours_${y}_${String(m+1).padStart(2,'0')}.xlsx`);
    };

    // Live Clock & Status Updater
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      if (todayData.inTime && !todayData.outTime) {
        document.getElementById('todayWork').textContent = formatDuration(calculateWorkMs(todayData));
        document.getElementById('todayBreak').textContent = formatDuration(calculateBreakTotalMs(todayData.breaks));
        renderHistoryTable(); // Update 'Working...' live row
      }

      // Check midnight rollover
      const newToday = getTodayString();
      if (newToday !== today) {
        today = newToday;
        todayData = appData[today] || { inTime: null, outTime: null, breaks: [] };
        updateUI();
      }
    }, 1000);

    // Initial render
    updateUI();
  </script>
</body>
</html>
